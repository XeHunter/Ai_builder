name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: omnipulse
          POSTGRES_PASSWORD: omnipulse
          POSTGRES_DB: omnipulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnipulse"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,redis,pgvector]"
      - name: Lint
        run: ruff check app tests
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://omnipulse:omnipulse@localhost:5432/omnipulse_test
        run: pytest
      - name: Migrate and seed on PostgreSQL + pgvector
        env:
          DATABASE_URL: postgresql+psycopg://omnipulse:omnipulse@localhost:5432/omnipulse_test
          APP_ENV: test
        run: python -m app.cli reset --yes --days 30 --scale 0.3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
