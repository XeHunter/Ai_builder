[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipulse-backend"
version = "0.1.0"
description = "OmniPulse AI - omnichannel retail intelligence platform (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.2",
  "starlette==1.8.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "email-validator==2.3.0",
  "SQLAlchemy==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "PyJWT==2.15.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.22",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "pillow==12.3.0",
  "openpyxl==3.1.5",
  "segno==1.6.6",
  "tzdata==2025.3",
]

[project.optional-dependencies]
redis = ["redis==6.4.0"]
pgvector = ["pgvector==0.4.1"]
gcp = ["firebase-admin==7.7.0"]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.14.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042", "UP046"]
